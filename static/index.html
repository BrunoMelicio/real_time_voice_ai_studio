<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 1.8rem;
            color: #00d9ff;
            margin-bottom: 5px;
        }

        header p {
            color: #888;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #0084ff;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.system {
            background: rgba(255, 200, 0, 0.2);
            align-self: center;
            font-size: 0.85rem;
            color: #ffcc00;
        }

        .message .label {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .input-area {
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: background 0.2s;
        }

        .text-input:focus {
            background: rgba(255, 255, 255, 0.15);
        }

        .text-input::placeholder {
            color: #888;
        }

        .btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-send {
            background: #0084ff;
        }

        .btn-record {
            background: #ff4444;
        }

        .btn-record.recording {
            background: #ff0000;
            animation: pulse 1s infinite;
        }

        .btn-live {
            background: #44aa44;
        }

        .btn-live.active {
            background: #00ff00;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid #666;
            width: 35px;
            height: 35px;
        }

        .btn-clear:hover {
            border-color: #ff4444;
        }

        .btn-clear svg {
            width: 18px;
            height: 18px;
            fill: #888;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 10px 15px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #00d9ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

        /* Tooltip */
        .btn[title] {
            position: relative;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .message {
                max-width: 90%;
            }

            .btn {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Voice Chat MVP</h1>
            <p>Talk to an AI assistant in real-time</p>
        </header>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="apiStatus"></div>
                <span id="apiStatusText">Checking API...</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="micStatus"></div>
                <span id="micStatusText">Microphone</span>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message system">
                    Welcome! Type a message or click the microphone to speak.
                </div>
            </div>

            <div class="input-area">
                <button class="btn btn-clear" id="clearBtn" title="Clear chat">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <input type="text" class="text-input" id="textInput" placeholder="Type a message..." autocomplete="off">
                <div class="controls">
                    <button class="btn btn-send" id="sendBtn" title="Send message">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                    <button class="btn btn-record" id="recordBtn" title="Hold to record">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                    </button>
                    <button class="btn btn-live" id="liveBtn" title="Toggle live mode">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Elements
        const messagesEl = document.getElementById('messages');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const recordBtn = document.getElementById('recordBtn');
        const liveBtn = document.getElementById('liveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const apiStatus = document.getElementById('apiStatus');
        const apiStatusText = document.getElementById('apiStatusText');
        const micStatus = document.getElementById('micStatus');
        const micStatusText = document.getElementById('micStatusText');

        // State
        let isRecording = false;
        let isLiveMode = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;

        // Check API status
        async function checkApiStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();

                if (data.groq_configured) {
                    apiStatus.classList.add('connected');
                    apiStatusText.textContent = 'API Connected';
                } else {
                    apiStatusText.textContent = 'API Key Missing';
                }
            } catch (error) {
                apiStatusText.textContent = 'API Error';
            }
        }

        // Check microphone access
        async function checkMicAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                micStatus.classList.add('connected');
                micStatusText.textContent = 'Mic Ready';
                return true;
            } catch (error) {
                micStatusText.textContent = 'Mic Denied';
                return false;
            }
        }

        // Add message to chat
        function addMessage(text, type = 'assistant', label = '') {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${type}`;

            if (label) {
                const labelEl = document.createElement('div');
                labelEl.className = 'label';
                labelEl.textContent = label;
                msgEl.appendChild(labelEl);
            }

            const textEl = document.createElement('div');
            textEl.textContent = text;
            msgEl.appendChild(textEl);

            messagesEl.appendChild(msgEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            return msgEl;
        }

        // Add loading indicator
        function addLoading() {
            const loadingEl = document.createElement('div');
            loadingEl.className = 'message assistant loading';
            loadingEl.id = 'loading';
            loadingEl.innerHTML = '<span></span><span></span><span></span>';
            messagesEl.appendChild(loadingEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // Remove loading indicator
        function removeLoading() {
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.remove();
        }

        // Play audio from base64
        function playAudio(base64Audio, format = 'wav') {
            const audio = new Audio(`data:audio/${format};base64,${base64Audio}`);
            audio.play().catch(e => console.error('Audio playback failed:', e));
            return audio;
        }

        // Send text message
        async function sendTextMessage() {
            const text = textInput.value.trim();
            if (!text) return;

            textInput.value = '';
            addMessage(text, 'user');
            addLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                removeLoading();
                const data = await response.json();
                addMessage(data.response, 'assistant');

                // Also speak the response
                speakText(data.response);
            } catch (error) {
                removeLoading();
                addMessage('Error: Could not get response', 'system');
            }
        }

        // Speak text
        async function speakText(text) {
            try {
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();
                if (data.audio) {
                    playAudio(data.audio, data.format);
                }
            } catch (error) {
                console.error('TTS error:', error);
            }
        }

        // Start recording
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    stream.getTracks().forEach(track => track.stop());
                    await processAudio(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
            } catch (error) {
                addMessage('Error: Could not access microphone', 'system');
            }
        }

        // Stop recording
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        }

        // Process recorded audio
        async function processAudio(audioBlob) {
            addLoading();

            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');

                const response = await fetch('/api/voice-chat', {
                    method: 'POST',
                    body: formData
                });

                removeLoading();
                const data = await response.json();

                // Show user's transcribed text
                addMessage(data.user_text, 'user', 'You said:');

                // Show and play assistant response
                addMessage(data.response_text, 'assistant');

                if (data.response_audio) {
                    const audio = playAudio(data.response_audio, data.audio_format);

                    // In live mode, start recording again after response
                    if (isLiveMode) {
                        audio.onended = () => {
                            setTimeout(startRecording, 500);
                        };
                    }
                }
            } catch (error) {
                removeLoading();
                addMessage('Error: Could not process audio', 'system');

                if (isLiveMode) {
                    setTimeout(startRecording, 1000);
                }
            }
        }

        // Toggle live mode
        function toggleLiveMode() {
            isLiveMode = !isLiveMode;
            liveBtn.classList.toggle('active', isLiveMode);

            if (isLiveMode) {
                addMessage('Live mode ON - Continuous conversation started', 'system');
                startRecording();
            } else {
                addMessage('Live mode OFF', 'system');
                stopRecording();
            }
        }

        // Clear chat
        async function clearChat() {
            try {
                await fetch('/api/clear-history', { method: 'POST' });
                messagesEl.innerHTML = '';
                addMessage('Chat cleared. Start a new conversation!', 'system');
            } catch (error) {
                console.error('Clear error:', error);
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendTextMessage);

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        recordBtn.addEventListener('mousedown', () => {
            if (!isLiveMode) startRecording();
        });

        recordBtn.addEventListener('mouseup', () => {
            if (!isLiveMode) stopRecording();
        });

        recordBtn.addEventListener('mouseleave', () => {
            if (!isLiveMode && isRecording) stopRecording();
        });

        // Touch events for mobile
        recordBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isLiveMode) startRecording();
        });

        recordBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!isLiveMode) stopRecording();
        });

        liveBtn.addEventListener('click', toggleLiveMode);
        clearBtn.addEventListener('click', clearChat);

        // Initialize
        checkApiStatus();
        checkMicAccess();
    </script>
</body>
</html>
